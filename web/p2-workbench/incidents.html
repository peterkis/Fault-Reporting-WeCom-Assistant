<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>公共故障 · 信息保障工作台</title><link rel="stylesheet" href="/static/workbench/lifecycle.css"></head>
<body><header class="service-header"><div><p class="kicker">信息保障 / INTERNAL BETA</p><h1>公共故障处理</h1></div><div class="service-meta"><span id="agent"></span><span id="connection">连接中</span><span>Asia/Shanghai</span></div></header>
<p class="boundary">仅限受控测试 · 非生产 / 非临床上线 · AI 未启用 · 共享故障须人工确认，个人工单独立保留</p>
<main class="layout"><nav class="navigation" aria-label="公共故障队列"><a href="/workbench/lifecycle">工单与人工复核 ↗</a>
<button id="candidates" type="button">待审核候选</button><button id="active" type="button">进行中的公共故障</button><button id="finished" type="button">已解决 / 已关闭</button></nav>
<section class="queue"><div class="section-heading"><h2 id="queue-title">待审核候选</h2><button id="refresh" type="button">刷新</button></div><ol id="list" class="item-list"></ol><button id="more" type="button" hidden>加载更多</button></section>
<section id="detail" class="detail" aria-label="公共故障详情"><p class="placeholder">选择一个候选或公共故障</p></section></main>
<div class="message-bar"><p id="status" role="status" aria-live="polite">正在验证坐席访问</p><button id="retry" type="button" hidden>核对同一命令</button></div>
<script type="module" src="/static/workbench/incidents.js"></script></body></html>
