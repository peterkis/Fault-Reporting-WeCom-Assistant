openapi: 3.1.0
info:
  title: Fault Reporting Conversation Center API
  version: 1.0.0
  description: >
    V1.4 contract for the lightweight human/AI conversation workbench.
    Ticket status remains authoritative in Unified Ticket Core.
    P2-006 implements these Human-only Internal Alpha REST and SSE routes while
    keeping all production feature flags disabled.
servers:
  - url: /api
paths:
  /workbench/bootstrap:
    get:
      operationId: getWorkbenchBootstrap
      responses:
        "200":
          description: Safe authenticated workbench bootstrap
          content:
            application/json:
              schema:
                $ref: "./workbench_bootstrap.schema.json"
  /conversations:
    get:
      operationId: listConversations
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [open, waiting_human, mine, unassigned, waiting_user, failed_delivery, ended]
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Conversation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
  /conversations/{sessionId}:
    get:
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Conversation session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations/{sessionId}/items:
    get:
      operationId: listConversationItems
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - in: query
          name: before_sequence
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]{0,18})$"
        - in: query
          name: after_sequence
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]{0,18})$"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Timeline page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after_sequence]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationItem"
                  next_after_sequence:
                    type: [integer, "null"]
  /conversations/{sessionId}/takeover:
    post:
      operationId: takeoverConversation
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_row_version, reason_code]
              properties:
                expected_row_version:
                  type: integer
                  minimum: 1
                reason_code:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "200":
          description: Handoff accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSession"
        "409":
          $ref: "#/components/responses/Conflict"
  /conversations/{sessionId}/handoff/request:
    post:
      operationId: requestConversationHandoff
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./conversation_control_command.schema.json"
      responses:
        "200": { description: Handoff requested }
  /conversations/{sessionId}/handoff/cancel:
    post:
      operationId: cancelConversationHandoff
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Handoff cancelled }
  /conversations/{sessionId}/transfer:
    post:
      operationId: transferConversation
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Assignment transferred }
  /conversations/{sessionId}/release:
    post:
      operationId: releaseConversation
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_row_version, reason_code]
              properties:
                expected_row_version:
                  type: integer
                  minimum: 1
                target_mode:
                  type: string
                  enum: [HUMAN]
                reason_code:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSession"
        "409":
          $ref: "#/components/responses/Conflict"
  /conversations/{sessionId}/messages:
    post:
      operationId: sendConversationMessage
      description: >
        P2-004 freezes this future HTTP contract but does not implement the route.
        Idempotency-Key MUST equal body.client_command_id, and body.session_id
        MUST equal the sessionId path parameter. The client cannot provide a
        provider, channel account, target, sender authority, lease, or status.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./conversation_reply_command.schema.json"
      responses:
        "202":
          description: Message and outbox committed
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/CommunicationCommandResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /conversations/{sessionId}/internal-notes:
    post:
      operationId: addInternalNote
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./communication_internal_note_command.schema.json"
      responses:
        "201":
          description: Internal note committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationCommandResult"
  /conversations/{sessionId}/read-cursor:
    post:
      operationId: advanceConversationReadCursor
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Principal read cursor advanced }
  /conversations/{sessionId}/eligible-principals:
    get:
      operationId: listEligibleConversationPrincipals
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Safe eligible principal list }
  /conversations/{sessionId}/deliveries:
    get:
      operationId: listConversationDeliveries
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Safe delivery views }
  /deliveries/{deliveryId}/retry:
    post:
      operationId: retryConversationDelivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workbench_delivery_action.schema.json"
      responses:
        "200": { description: Delivery remains or becomes safely pending }
        "409": { description: Explicit reconciliation is required }
  /deliveries/{deliveryId}/reconcile:
    post:
      operationId: reconcileConversationDelivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workbench_delivery_action.schema.json"
      responses:
        "200": { description: Authorized explicit reconciliation result }
  /realtime/events:
    get:
      operationId: streamRealtimeEvents
      description: >
        Durable PostgreSQL-backed authorized replay stream. The in-process
        wakeup hub is only a latency optimization; reconnect uses Last-Event-ID.
      parameters:
        - in: header
          name: Last-Event-ID
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]{0,18})$"
            maxLength: 19
        - in: query
          name: scope
          schema:
            type: string
            enum: [workbench]
            default: workbench
      responses:
        "200":
          description: Server-sent event stream
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache, no-transform
            Connection:
              schema:
                type: string
                const: keep-alive
            X-Accel-Buffering:
              schema:
                type: string
                const: no
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                event:
                  value: "id: 42\nevent: conversation.item.created\ndata: {\"event_id\":\"42\",\"event_type\":\"conversation.item.created\"}\n\n"
                heartbeat:
                  value: ": heartbeat\n\n"
        "400":
          description: Invalid Last-Event-ID or scope
        "401":
          description: Authentication required; never converted to polling fallback
        "403":
          description: Authenticated caller is not authorized; no scope details disclosed
        "409":
          description: Last-Event-ID is ahead of the durable high watermark
        "410":
          description: Last-Event-ID is below the retention floor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeFallbackEnvelope"
        "503":
          description: SSE disabled, at capacity, or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeFallbackEnvelope"
components:
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
      description: Must exactly equal body.client_command_id for Communication commands.
  responses:
    NotFound:
      description: Resource not found or not visible
    Conflict:
      description: Row version, ownership, mode or idempotency conflict
  schemas:
    CommunicationMessage:
      $ref: "./communication_message.schema.json"
    CommunicationDelivery:
      $ref: "./communication_delivery.schema.json"
    CommunicationCommandResult:
      type: object
      additionalProperties: false
      required: [message_id, outbox_id, delivery_ids, command_status, replayed, created_at]
      properties:
        message_id:
          type: string
          format: uuid
        outbox_id:
          type: [string, "null"]
          format: uuid
        delivery_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        command_status:
          type: string
          enum: [COMMITTED, REPLAYED]
        replayed:
          type: boolean
        created_at:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]
    RealtimeEvent:
      $ref: "./conversation_realtime_event.schema.json"
    RealtimeFallback:
      $ref: "./conversation_realtime_fallback.schema.json"
    RealtimeFallbackEnvelope:
      type: object
      additionalProperties: false
      required: [ok, error, fallback]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          additionalProperties: false
          required: [code, retryable]
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 64
            retryable:
              type: boolean
        fallback:
          $ref: "#/components/schemas/RealtimeFallback"
    ConversationSession:
      description: >
        Public workbench view of a Conversation Session. Provider participant
        identifiers, scope digests, and creation idempotency keys are internal
        contract fields and are intentionally excluded from this response.
      type: object
      additionalProperties: false
      required:
        - id
        - thread_id
        - service_intake_id
        - status
        - control_mode
        - generation_version
        - row_version
        - last_activity_at
      properties:
        id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        service_intake_id:
          type: [string, "null"]
          format: uuid
        status:
          type: string
          enum: [OPEN, WAITING_USER, ENDED]
        control_mode:
          type: string
          enum: [AUTO, COPILOT, HUMAN]
        generation_version:
          type: integer
          minimum: 1
        row_version:
          type: integer
          minimum: 1
        last_activity_at:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          x-business-timezone: Asia/Shanghai
          x-precision: second
          x-offset-allowed: false
    ConversationItem:
      $ref: "./conversation_item.schema.json"
    ConversationSummary:
      type: object
      required: [session, unread_count, last_item]
      properties:
        session:
          $ref: "#/components/schemas/ConversationSession"
        unread_count:
          type: integer
          minimum: 0
        last_item:
          anyOf:
            - $ref: "#/components/schemas/ConversationItem"
            - type: "null"
    ConversationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        next_cursor:
          type: [string, "null"]
    ConversationDetail:
      type: object
      required: [session, items]
      properties:
        session:
          $ref: "#/components/schemas/ConversationSession"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationItem"
        ticket:
          type: [object, "null"]
        incident:
          type: [object, "null"]


          x-business-timezone: Asia/Shanghai

          x-precision: second

          x-offset-allowed: false
    RealtimeEvent:
      $ref: "./conversation_realtime_event.schema.json"
    RealtimeFallback:
      $ref: "./conversation_realtime_fallback.schema.json"
    RealtimeFallbackEnvelope:
      type: object
      additionalProperties: false
      required: [ok, error, fallback]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          additionalProperties: false
          required: [code, retryable]
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 64
            retryable:
              type: boolean
        fallback:
          $ref: "#/components/schemas/RealtimeFallback"
    ConversationSession:
      description: >
        Public workbench view of a Conversation Session. Provider participant
        identifiers, scope digests, and creation idempotency keys are internal
        contract fields and are intentionally excluded from this response.
      type: object
      additionalProperties: false
      required:
        - id
        - thread_id
        - service_intake_id
        - status
        - control_mode
        - generation_version
        - row_version
        - last_activity_at
      properties:
        id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        service_intake_id:
          type: [string, "null"]
          format: uuid
        status:
          type: string
          enum: [OPEN, WAITING_USER, ENDED]
        control_mode:
          type: string
          enum: [AUTO, COPILOT, HUMAN]
        generation_version:
          type: integer
          minimum: 1
        row_version:
          type: integer
          minimum: 1
        last_activity_at:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]
    ConversationItem:
      $ref: "./conversation_item.schema.json"
    ConversationSummary:
      type: object
      required: [session, unread_count, last_item]
      properties:
        session:
          $ref: "#/components/schemas/ConversationSession"
        unread_count:
          type: integer
          minimum: 0
        last_item:
          anyOf:
            - $ref: "#/components/schemas/ConversationItem"
            - type: "null"
    ConversationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        next_cursor:
          type: [string, "null"]
    ConversationDetail:
      type: object
      required: [session, items]
      properties:
        session:
          $ref: "#/components/schemas/ConversationSession"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationItem"
        ticket:
          type: [object, "null"]
        incident:
          type: [object, "null"]


          x-business-timezone: Asia/Shanghai

          x-precision: second

          x-offset-allowed: false
    ConversationItem:
      $ref: "./conversation_item.schema.json"
    ConversationSummary:
      type: object
      required: [session, unread_count, last_item]
      properties:
        session:
          $ref: "#/components/schemas/ConversationSession"
        unread_count:
          type: integer
          minimum: 0
        last_item:
          anyOf:
            - $ref: "#/components/schemas/ConversationItem"
            - type: "null"
    ConversationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        next_cursor:
          type: [string, "null"]
    ConversationDetail:
      type: object
      required: [session, items]
      properties:
        session:
          $ref: "#/components/schemas/ConversationSession"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationItem"
        ticket:
          type: [object, "null"]
        incident:
          type: [object, "null"]
