  /reporter/tickets/{publicRef}/timeline: {"servers":[{"url":"/api"}],"get":{"security":[{"WeComMember":[]}],"x-reporter-policy":"MEMBER_REQUIRED","x-legacy-compatibility":"LEGACY_BOUND_GRANT only when explicitly selected by the server for isolated compatibility; never an authentication fallback.","x-reject-unknown-query":true,"operationId":"listP2016ReporterTimeline","description":"OAuth plus authoritative source-Intake ownership, enterprise/Bot, binding, active ref and retention checked on every request including304; one transaction; late revoked identity rejected. no-store/no-referrer.","parameters":[{"in":"path","name":"publicRef","required":true,"schema":{"type":"string","pattern":"^[A-Za-z0-9_-]{32}$"}},{"in":"query","name":"cursor","schema":{"type":"string","minLength":10,"maxLength":2048}},{"in":"query","name":"limit","schema":{"type":"integer","minimum":1,"maximum":100,"default":30}}],"responses":{"200":{"description":"Shared Reporter-safe projection","content":{"application/json":{"schema":{"$ref":"./p2_016_reporter_timeline.schema.json"}}}},"304":{"description":"Authenticated and authorized unchanged representation"},"400":{"description":"Invalid closed input or duplicate/unknown query","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"401":{"description":"Current member authentication required","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"403":{"description":"Origin or member scope denied","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"404":{"description":"Ticket not owned or not available; no existence disclosure","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"503":{"description":"Fail closed; no legacy fallback","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}}}}}
  /wecom/yixiaoxiu/tickets/{publicRef}: {"servers":[{"url":"/"}],"get":{"operationId":"openYxxTicket","security":[],"parameters":[{"in":"path","name":"publicRef","required":true,"schema":{"type":"string","pattern":"^[A-Za-z0-9_-]{32}$"}}],"description":"Anonymous shell/redirect reveals no Ticket existence or details. Opaque one-use browser-bound OAuth intent preserves this ref.","responses":{"200":{"description":"Empty page shell; API authorizes separately"},"302":{"description":"Fixed OAuth authorization with opaque state"},"400":{"description":"Invalid closed input or duplicate/unknown query","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"401":{"description":"Current member authentication required","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"403":{"description":"Origin or member scope denied","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"404":{"description":"Ticket not owned or not available; no existence disclosure","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"503":{"description":"Fail closed; no legacy fallback","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}}}}}
  /wecom/yixiaoxiu/continue/{entryRef}: {"servers":[{"url":"/"}],"get":{"operationId":"continueYxxLegacyEntry","security":[],"parameters":[{"in":"path","name":"entryRef","required":true,"schema":{"type":"string","pattern":"^[a-f0-9]{64}$"}}],"description":"Current-browser continuation only. OAuth then validate current HMAC/digest, active ref and ownership; consumed/expired Grant locates without resurrection.","responses":{"302":{"description":"OAuth required"},"303":{"description":"Fixed canonical Ticket path after ownership"},"400":{"description":"Invalid closed input or duplicate/unknown query","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"401":{"description":"Current member authentication required","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"403":{"description":"Origin or member scope denied","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"404":{"description":"Unavailable Ticket returns JSON; missing, expired or foreign-browser continuation returns a generic HTML prompt to click the original card again.","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}},"text/html":{"schema":{"type":"string"}}}},"503":{"description":"Fail closed; no legacy fallback","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}}}}}
  /wecom/yixiaoxiu/login: {"servers":[{"url":"/"}],"get":{"operationId":"beginYxxOAuth","security":[],"x-reject-unknown-query":true,"responses":{"302":{"description":"snsapi_base on fixed provider and callback"},"400":{"description":"Invalid closed input or duplicate/unknown query","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"401":{"description":"Current member authentication required","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"403":{"description":"Origin or member scope denied","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"404":{"description":"Ticket not owned or not available; no existence disclosure","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"503":{"description":"Fail closed; no legacy fallback","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}}}}}
  /wecom/yixiaoxiu/callback: {"servers":[{"url":"/"}],"get":{"operationId":"completeYxxOAuth","security":[],"x-reject-unknown-query":true,"parameters":[{"in":"query","name":"code","required":true,"schema":{"type":"string","minLength":1,"maxLength":512}},{"in":"query","name":"state","required":true,"schema":{"type":"string","pattern":"^[a-f0-9]{64}$"}}],"description":"Single code/state only; cross-site navigation allowed; one-use browser binding, fixed local303. Errors are safe static OAuth HTML, not raw Provider text.","responses":{"303":{"description":"Clean server-intent destination"},"401":{"description":"Invalid/replayed OAuth context"},"403":{"description":"Not an eligible member"},"502":{"description":"Bounded Provider failure"},"503":{"description":"Disabled or at capacity"}}}}
  /wecom/yixiaoxiu/: {"servers":[{"url":"/"}],"get":{"operationId":"getYxxHome","security":[{"WeComMember":[]}],"description":"Authentication status only; choose no Ticket, no listing or staff authority.","responses":{"200":{"description":"Static authentication home"},"401":{"description":"OAuth required"},"503":{"description":"Disabled"}}}}
  /reporter/: {"servers":[{"url":"/"}],"get":{"operationId":"getYxxAssetreporter","security":[],"description":"Static same-origin Reporter assets; member legacy landing clears fragment before prepare. No embedded business data.","responses":{"200":{"description":"Static HTML/JS/CSS"},"400":{"description":"Unsupported query or method"},"503":{"description":"Disabled"}}}}
  /reporter/open: {"servers":[{"url":"/"}],"get":{"operationId":"getYxxAssetreporteropen","security":[],"description":"Static same-origin Reporter assets; member legacy landing clears fragment before prepare. No embedded business data.","responses":{"200":{"description":"Static HTML/JS/CSS"},"400":{"description":"Unsupported query or method"},"503":{"description":"Disabled"}}}}
  /reporter/reporter.js: {"servers":[{"url":"/"}],"get":{"operationId":"getYxxAssetreporterreporterjs","security":[],"description":"Static same-origin Reporter assets; member legacy landing clears fragment before prepare. No embedded business data.","responses":{"200":{"description":"Static HTML/JS/CSS"},"400":{"description":"Unsupported query or method"},"503":{"description":"Disabled"}}}}
  /reporter/reporter.css: {"servers":[{"url":"/"}],"get":{"operationId":"getYxxAssetreporterreportercss","security":[],"description":"Static same-origin Reporter assets; member legacy landing clears fragment before prepare. No embedded business data.","responses":{"200":{"description":"Static HTML/JS/CSS"},"400":{"description":"Unsupported query or method"},"503":{"description":"Disabled"}}}}
  /workbench/bootstrap:
    get:
      operationId: getWorkbenchBootstrap
      responses:
        "200":
          description: Safe authenticated workbench bootstrap
          content:
            application/json:
              schema:
                $ref: "./workbench_bootstrap.schema.json"
  /conversations:
    get:
      operationId: listConversations
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [open, waiting_human, mine, unassigned, waiting_user, failed_delivery, ended]
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Conversation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
  /conversations/{sessionId}:
    get:
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Conversation session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations/{sessionId}/items:
    get:
      operationId: listConversationItems
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - in: query
          name: before_sequence
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]{0,18})$"
        - in: query
          name: after_sequence
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]{0,18})$"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Timeline page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after_sequence]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationItem"
                  next_after_sequence:
                    type: [integer, "null"]
  /conversations/{sessionId}/takeover:
    post:
      operationId: takeoverConversation
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_row_version, reason_code]
              properties:
                expected_row_version:
                  type: integer
                  minimum: 1
                reason_code:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "200":
          description: Handoff accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSession"
        "409":
          $ref: "#/components/responses/Conflict"
  /conversations/{sessionId}/handoff/request:
    post:
      operationId: requestConversationHandoff
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./conversation_control_command.schema.json"
      responses:
        "200": { description: Handoff requested }
  /conversations/{sessionId}/handoff/cancel:
    post:
      operationId: cancelConversationHandoff
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Handoff cancelled }
  /conversations/{sessionId}/transfer:
    post:
      operationId: transferConversation
      description: Admin force transfer requires an explicit nonempty reason_code.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_command_id, expected_row_version, target_principal_id]
              properties:
                client_command_id: { type: string, format: uuid }
                expected_row_version: { type: integer, minimum: 1 }
                target_principal_id: { type: string, format: uuid }
                force: { type: boolean, default: false }
                reason_code: { type: string, pattern: '^[A-Z0-9_]{1,128}$' }
              if:
                required: [force]
                properties:
                  force: { const: true }
              then:
                required: [reason_code]
      responses:
        "200": { description: Assignment transferred }
        "400": { description: Invalid command or missing explicit force-transfer reason }
  /conversations/{sessionId}/release:
    post:
      operationId: releaseConversation
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_row_version, reason_code]
              properties:
                expected_row_version:
                  type: integer
                  minimum: 1
                target_mode:
                  type: string
                  enum: [HUMAN]
                reason_code:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSession"
        "409":
          $ref: "#/components/responses/Conflict"
  /conversations/{sessionId}/messages:
    post:
      operationId: sendConversationMessage
      description: >
        P2-004 freezes this future HTTP contract but does not implement the route.
        Idempotency-Key MUST equal body.client_command_id, and body.session_id
        MUST equal the sessionId path parameter. The client cannot provide a
        provider, channel account, target, sender authority, lease, or status.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./conversation_reply_command.schema.json"
      responses:
        "202":
          description: Message and outbox committed
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/CommunicationCommandResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /conversations/{sessionId}/internal-notes:
    post:
      operationId: addInternalNote
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./communication_internal_note_command.schema.json"
      responses:
        "201":
          description: Internal note committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationCommandResult"
  /conversations/{sessionId}/read-cursor:
    post:
      operationId: advanceConversationReadCursor
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Principal read cursor advanced }
  /conversations/{sessionId}/eligible-principals:
    get:
      operationId: listEligibleConversationPrincipals
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Safe eligible principal list }
  /conversations/{sessionId}/deliveries:
    get:
      operationId: listConversationDeliveries
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Safe delivery views }
  /deliveries/{deliveryId}/retry:
    post:
      operationId: retryConversationDelivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workbench_delivery_action.schema.json"
      responses:
        "200": { description: Delivery remains or becomes safely pending }
        "409": { description: Explicit reconciliation is required }
  /deliveries/{deliveryId}/reconcile:
    post:
      operationId: reconcileConversationDelivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workbench_delivery_action.schema.json"
      responses:
        "200": { description: Authorized explicit reconciliation result }
  /realtime/events:
    get:
      operationId: streamRealtimeEvents
      description: >
        Durable PostgreSQL-backed authorized replay stream. The in-process
        wakeup hub is only a latency optimization; reconnect uses Last-Event-ID.
      parameters:
        - in: header
          name: Last-Event-ID
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]{0,18})$"
            maxLength: 19
        - in: query
          name: scope
          schema:
            type: string
            enum: [workbench]
            default: workbench
      responses:
        "200":
          description: Server-sent event stream
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache, no-transform
            Connection:
              schema:
                type: string
                const: keep-alive
            X-Accel-Buffering:
              schema:
                type: string
                const: no
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                event:
                  value: "id: 42\nevent: conversation.item.created\ndata: {\"event_id\":\"42\",\"event_type\":\"conversation.item.created\"}\n\n"
                heartbeat:
                  value: ": heartbeat\n\n"
        "400":
          description: Invalid Last-Event-ID or scope
        "401":
          description: Authentication required; never converted to polling fallback
        "403":
          description: Authenticated caller is not authorized; no scope details disclosed
        "409":
          description: Last-Event-ID is ahead of the durable high watermark
        "410":
          description: Last-Event-ID is below the retention floor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeFallbackEnvelope"
        "503":
          description: SSE disabled, at capacity, or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeFallbackEnvelope"
