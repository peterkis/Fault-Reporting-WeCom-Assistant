  /wecom/yixiaoxiu/logout: {"servers":[{"url":"/"}],"post":{"security":[{"WeComMember":[]}],"x-reporter-policy":"MEMBER_REQUIRED","x-legacy-compatibility":"LEGACY_BOUND_GRANT only when explicitly selected by the server for isolated compatibility; never an authentication fallback.","x-reject-unknown-query":true,"operationId":"logoutYxxMember","description":"Same-origin JSON POST. Revoke all recognized browser bindings, pending/in-flight authentication and member sessions. No business action.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_logout.schema.json"}}}},"responses":{"200":{"description":"Member authentication revoked","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_logged_out.schema.json"}}}},"400":{"description":"Invalid closed input or duplicate/unknown query","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"401":{"description":"Current member authentication required","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"403":{"description":"Origin or member scope denied","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"404":{"description":"Ticket not owned or not available; no existence disclosure","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}},"503":{"description":"Fail closed; no legacy fallback","content":{"application/json":{"schema":{"$ref":"./yixiaoxiu_error.schema.json"}}}}}}}
