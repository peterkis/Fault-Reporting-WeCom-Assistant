components:
  securitySchemes:
    WeComMember: {type: apiKey, in: cookie, name: __Host-wecom_session, description: "Secure HttpOnly member authentication only; per-request server ownership is required."}
    InternalSession: {type: apiKey, in: cookie, name: p2_g1_test, description: Existing configured internal test session; multi-agent suffixes are server configured.}
    InternalBearer: {type: http, scheme: bearer, description: Existing authentication port only; never a query token.}
    ReporterSession: {type: apiKey, in: cookie, name: p2016_reporter, description: HttpOnly Secure SameSite Strict cookie bound to exactly one Ticket.}
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
      description: Must exactly equal body.client_command_id for Communication commands.
  responses:
    NotFound:
      description: Resource not found or not visible
    Conflict:
      description: Row version, ownership, mode or idempotency conflict
  schemas:
    CommunicationMessage:
      $ref: "./communication_message.schema.json"
    CommunicationDelivery:
      $ref: "./communication_delivery.schema.json"
    CommunicationCommandResult:
      type: object
      additionalProperties: false
      required: [message_id, outbox_id, delivery_ids, command_status, replayed, created_at]
      properties:
        message_id:
          type: string
          format: uuid
        outbox_id:
          type: [string, "null"]
          format: uuid
        delivery_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        command_status:
          type: string
          enum: [COMMITTED, REPLAYED]
        replayed:
          type: boolean
        created_at:
          $ref: "./local_datetime.schema.json"
    RealtimeEvent:
      $ref: "./conversation_realtime_event.schema.json"
    RealtimeFallback:
      $ref: "./conversation_realtime_fallback.schema.json"
    RealtimeFallbackEnvelope:
      type: object
      additionalProperties: false
      required: [ok, error, fallback]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          additionalProperties: false
          required: [code, retryable]
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 64
            retryable:
              type: boolean
        fallback:
          $ref: "#/components/schemas/RealtimeFallback"
    ConversationSession:
      description: >
        Public workbench view of a Conversation Session. Provider participant
        identifiers, scope digests, and creation idempotency keys are internal
        contract fields and are intentionally excluded from this response.
      type: object
      additionalProperties: false
      required:
        - id
        - thread_id
        - service_intake_id
        - status
        - control_mode
        - generation_version
        - row_version
        - last_activity_at
      properties:
        id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        service_intake_id:
          type: [string, "null"]
          format: uuid
        status:
          type: string
          enum: [OPEN, WAITING_USER, ENDED]
        control_mode:
          type: string
          enum: [AUTO, COPILOT, HUMAN]
        generation_version:
          type: integer
          minimum: 1
        row_version:
          type: integer
          minimum: 1
        last_activity_at:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          x-business-timezone: Asia/Shanghai
          x-precision: second
          x-offset-allowed: false
    ConversationItem:
      $ref: "./conversation_item.schema.json"
    ConversationSummary:
      type: object
      required: [session, unread_count, last_item]
      properties:
        session:
          $ref: "#/components/schemas/ConversationSession"
        unread_count:
          type: integer
          minimum: 0
        last_item:
          anyOf:
            - $ref: "#/components/schemas/ConversationItem"
            - type: "null"
    ConversationPage:
      $ref: "./workbench_conversation_page.schema.json"
    ConversationDetail:
      $ref: "./workbench_conversation_detail.schema.json"
