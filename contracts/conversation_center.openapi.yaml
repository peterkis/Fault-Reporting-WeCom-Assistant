openapi: 3.1.0
info:
  title: Fault Reporting Conversation Center API
  version: 1.0.0
  description: >
    V1.4 contract for the lightweight human/AI conversation workbench.
    Ticket status remains authoritative in Unified Ticket Core.
    P2-006 implements these Human-only Internal Alpha REST and SSE routes while
    keeping all production feature flags disabled.
servers:
  - url: /api
paths:
  /workbench/bootstrap:
    get:
      operationId: getWorkbenchBootstrap
      responses:
        "200":
          description: Safe authenticated workbench bootstrap
          content:
            application/json:
              schema:
                $ref: "./workbench_bootstrap.schema.json"
  /conversations:
    get:
      operationId: listConversations
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [open, waiting_human, mine, unassigned, waiting_user, failed_delivery, ended]
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Conversation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
  /conversations/{sessionId}:
    get:
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Conversation session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations/{sessionId}/items:
    get:
      operationId: listConversationItems
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - in: query
          name: before_sequence
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]{0,18})$"
        - in: query
          name: after_sequence
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]{0,18})$"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Timeline page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after_sequence]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationItem"
                  next_after_sequence:
                    type: [integer, "null"]
  /conversations/{sessionId}/takeover:
    post:
      operationId: takeoverConversation
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_row_version, reason_code]
              properties:
                expected_row_version:
                  type: integer
                  minimum: 1
                reason_code:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "200":
          description: Handoff accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSession"
        "409":
          $ref: "#/components/responses/Conflict"
  /conversations/{sessionId}/handoff/request:
    post:
      operationId: requestConversationHandoff
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./conversation_control_command.schema.json"
      responses:
        "200": { description: Handoff requested }
  /conversations/{sessionId}/handoff/cancel:
    post:
      operationId: cancelConversationHandoff
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Handoff cancelled }
  /conversations/{sessionId}/transfer:
    post:
      operationId: transferConversation
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Assignment transferred }
  /conversations/{sessionId}/release:
    post:
      operationId: releaseConversation
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_row_version, reason_code]
              properties:
                expected_row_version:
                  type: integer
                  minimum: 1
                target_mode:
                  type: string
                  enum: [HUMAN]
                reason_code:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSession"
        "409":
          $ref: "#/components/responses/Conflict"
  /conversations/{sessionId}/messages:
    post:
      operationId: sendConversationMessage
      description: >
        P2-004 freezes this future HTTP contract but does not implement the route.
        Idempotency-Key MUST equal body.client_command_id, and body.session_id
        MUST equal the sessionId path parameter. The client cannot provide a
        provider, channel account, target, sender authority, lease, or status.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./conversation_reply_command.schema.json"
      responses:
        "202":
          description: Message and outbox committed
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/CommunicationCommandResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /conversations/{sessionId}/internal-notes:
    post:
      operationId: addInternalNote
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./communication_internal_note_command.schema.json"
      responses:
        "201":
          description: Internal note committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationCommandResult"
  /conversations/{sessionId}/read-cursor:
    post:
      operationId: advanceConversationReadCursor
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Principal read cursor advanced }
  /conversations/{sessionId}/eligible-principals:
    get:
      operationId: listEligibleConversationPrincipals
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Safe eligible principal list }
  /conversations/{sessionId}/deliveries:
    get:
      operationId: listConversationDeliveries
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Safe delivery views }
  /deliveries/{deliveryId}/retry:
    post:
      operationId: retryConversationDelivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workbench_delivery_action.schema.json"
      responses:
        "200": { description: Delivery remains or becomes safely pending }
        "409": { description: Explicit reconciliation is required }
  /deliveries/{deliveryId}/reconcile:
    post:
      operationId: reconcileConversationDelivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./workbench_delivery_action.schema.json"
      responses:
        "200": { description: Authorized explicit reconciliation result }
  /realtime/events:
    get:
      operationId: streamRealtimeEvents
      description: >
        Durable PostgreSQL-backed authorized replay stream. The in-process
        wakeup hub is only a latency optimization; reconnect uses Last-Event-ID.
      parameters:
        - in: header
          name: Last-Event-ID
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]{0,18})$"
            maxLength: 19
        - in: query
          name: scope
          schema:
            type: string
            enum: [workbench]
            default: workbench
      responses:
        "200":
          description: Server-sent event stream
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache, no-transform
            Connection:
              schema:
                type: string
                const: keep-alive
            X-Accel-Buffering:
              schema:
                type: string
                const: no
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                event:
                  value: "id: 42\nevent: conversation.item.created\ndata: {\"event_id\":\"42\",\"event_type\":\"conversation.item.created\"}\n\n"
                heartbeat:
                  value: ": heartbeat\n\n"
        "400":
          description: Invalid Last-Event-ID or scope
        "401":
          description: Authentication required; never converted to polling fallback
        "403":
          description: Authenticated caller is not authorized; no scope details disclosed
        "409":
          description: Last-Event-ID is ahead of the durable high watermark
        "410":
          description: Last-Event-ID is below the retention floor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeFallbackEnvelope"
        "503":
          description: SSE disabled, at capacity, or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeFallbackEnvelope"
  /lifecycle/bootstrap:
    get:
      operationId: getP2016Bootstrap
      tags: [P2-016]
      security: [{InternalSession: []}, {InternalBearer: []}]
      responses:
        '200':
          description: Safe bounded result; not Phase 2 Go or live acceptance
        '400': {description: Invalid or non-canonical input}
        '401': {description: Missing or expired authentication}
        '403': {description: Scope or CSRF denied}
        '404': {description: Not found or not visible}
        '409': {description: Version, command hash or state conflict}
        '503': {description: Disabled or temporarily unavailable}
  /tickets:
    get:
      operationId: listP2016Tickets
      tags: [P2-016]
      security: [{InternalSession: []}, {InternalBearer: []}]
      parameters:
        - {"in":"query","name":"state","schema":{"type":"string","enum":["queued","accepted","in_progress","waiting_requester","waiting_vendor","resolved","closed","reopened","cancelled","unassigned","mine","failed_delivery"]}}
        - {"in":"query","name":"cursor","schema":{"type":"string","minLength":10,"maxLength":2048}}
        - {"in":"query","name":"limit","schema":{"type":"integer","minimum":1,"maximum":100,"default":30}}
      responses:
        '200':
          description: Safe bounded result; not Phase 2 Go or live acceptance
          content:
            application/json:
              schema: {"$ref":"./p2_016_ticket_list.schema.json"}
        '400': {description: Invalid or non-canonical input}
        '401': {description: Missing or expired authentication}
        '403': {description: Scope or CSRF denied}
        '404': {description: Not found or not visible}
        '409': {description: Version, command hash or state conflict}
        '503': {description: Disabled or temporarily unavailable}
  /tickets/{ticketId}:
