        - {"in":"header","name":"If-Match","required":true,"description":"Canonical expected version; must equal the body version.","schema":{"type":"string","minLength":1,"maxLength":21}}
      description: "Existing internal authentication required. Cookie requests require exact Origin, SameSite and X-CSRF-Token. Receipt scope is the authenticated principal. No arbitrary destination or SYSTEM action."
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"./p2_016_ticket_action_command.schema.json"}
      responses:
