        '409':
          $ref: '#/components/responses/Error'
  /health/live:
    get:
      summary: Liveness
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: WebSocket authenticated and core dependencies ready
        '503':
          description: Not ready
