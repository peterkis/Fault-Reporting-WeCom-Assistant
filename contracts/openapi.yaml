openapi: 3.1.0
info:
  title: WeCom Fault Reporting Pilot Internal API
  version: 1.2.0
  x-architecture-baseline: V1.2
  x-phase-scope: [P1, P2]
  x-business-timezone: Asia/Shanghai
  x-time-precision: second
  description: >
    医院信息故障智能报修助手 Phase 1/2 的内部接口基线。AI/OCR 仅返回建议，
    Pilot Ticket Core 是当前工单事实源，创建接口必须支持幂等。
    Phase 1 不连接 Hospital Tickets；Phase 3 Ticket Adapter 契约将在 P3-003 冻结。
servers:
  - url: https://pilot.example.invalid
paths:
  /internal/v1/intakes/wecom:
    post:
      summary: 接收标准化企业微信消息并创建或追加 Service Intake
      operationId: createWeComIntake
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalizedWeComMessage'
      responses:
        '200':
          description: 成功或重复请求返回原处理结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeResponse'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /internal/v1/messages/{messageId}/media:
    post:
      summary: 登记已下载、解密并存入私有对象存储的媒体
      operationId: registerMedia
      parameters:
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaRegistration'
      responses:
        '201':
          description: 媒体登记成功
        '400':
          $ref: '#/components/responses/Error'
  /internal/v1/ai/triage:
    post:
      summary: AI/OCR 分诊建议
      operationId: triageIntake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AITriageRequest'
      responses:
        '200':
          description: 结构化建议
          content:
            application/json:
              schema:
                $ref: './ai_triage_result.schema.json'
        '503':
          $ref: '#/components/responses/Error'
  /internal/v1/wecom/card-actions:
    post:
      summary: 处理企业微信模板卡片按钮事件
      operationId: handleCardAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardAction'
      responses:
        '200':
          description: 返回卡片更新内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardActionResponse'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/accept:
    post:
      summary: 工程师接单
      operationId: acceptTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/start:
    post:
      summary: 开始处理
      operationId: startTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/request-information:
    post:
      summary: 请求申报人补充信息
      operationId: requestTicketInformation
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/resolve:
    post:
      summary: 标记处理完成，等待确认
      operationId: resolveTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/confirm:
    post:
      summary: 申报人确认恢复
      operationId: confirmTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/reopen:
    post:
      summary: 申报人反馈仍未恢复
      operationId: reopenTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /health/live:
    get:
      summary: Liveness
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: WebSocket authenticated and core dependencies ready
        '503':
          description: Not ready
components:
  parameters:
    TicketId:
      in: path
      name: ticketId
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    TicketAction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TicketActionRequest'
  responses:
    TicketActionSuccess:
      description: Action executed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TicketActionResponse'
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LocalDate:
      $ref: './local_date.schema.json'
    LocalTime:
      $ref: './local_time.schema.json'
    LocalDateTime:
      $ref: './local_datetime.schema.json'
    PhysicalEpochMs:
      $ref: './epoch_ms_string.schema.json'
    NormalizedWeComMessage:
      $ref: './normalized_wecom_message.schema.json'
    IntakeResponse:
      type: object
      required: [trace_id, duplicate, intake_id]
      properties:
        trace_id:
          type: string
        duplicate:
          type: boolean
        intake_id:
          type: string
          format: uuid
        ticket_id:
          type: [string, 'null']
          format: uuid
        ticket_no:
          type: [string, 'null']
        external_status:
          type: [string, 'null']
        reply:
          type: [object, 'null']
          additionalProperties: true
    MediaRegistration:
      type: object
      required: [object_key, mime_type, size_bytes, sha256, security_scan_status]
      properties:
        object_key:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
        security_scan_status:
          enum: [PENDING, PASSED, REJECTED, FAILED]
        sensitivity_level:
          enum: [UNKNOWN, INTERNAL, PERSONAL, PATIENT_SENSITIVE, SECRET]
    AITriageRequest:
      type: object
      required: [intake_id, text]
      properties:
        intake_id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 20000
        ocr_text_redacted:
          type: [string, 'null']
          maxLength: 50000
        context:
          type: object
          additionalProperties: true
        catalog_version:
          type: [string, 'null']
    CardAction:
      type: object
      required: [task_id, action_key, actor_wecom_userid, event_req_id]
      properties:
        task_id:
          type: string
        action_key:
          enum: [confirm_resolved, still_broken, add_information, view_ticket, subscribe_incident]
        actor_wecom_userid:
          type: string
        event_req_id:
          type: string
    CardActionResponse:
      type: object
      required: [trace_id, update_card]
      properties:
        trace_id:
          type: string
        update_card:
          type: object
          additionalProperties: true
    TicketActionRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 0
        note:
          type: [string, 'null']
          maxLength: 2000
        external_visible:
          type: boolean
          default: false
        reason_code:
          type: [string, 'null']
        attachment_ids:
          type: array
          items:
            type: string
            format: uuid
    TicketActionResponse:
      type: object
      required: [trace_id, ticket]
      properties:
        trace_id:
          type: string
        ticket:
          type: object
          required: [id, status, version]
          properties:
            id:
              type: string
              format: uuid
            ticket_no:
              type: string
            status:
              type: string
            version:
              type: integer
    ErrorResponse:
      type: object
      required: [trace_id, error]
      properties:
        trace_id:
          type: string
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
