  /internal/v1/intakes/wecom:
    post:
      summary: 接收标准化企业微信消息并创建或追加 Service Intake
      operationId: createWeComIntake
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalizedWeComMessage'
      responses:
        '200':
          description: 成功或重复请求返回原处理结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeResponse'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /internal/v1/messages/{messageId}/media:
    post:
      summary: 登记已下载、解密并存入私有对象存储的媒体
      operationId: registerMedia
      parameters:
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaRegistration'
      responses:
        '201':
          description: 媒体登记成功
        '400':
          $ref: '#/components/responses/Error'
  /internal/v1/ai/triage:
    post:
      summary: AI/OCR 分诊建议
      operationId: triageIntake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AITriageRequest'
      responses:
        '200':
          description: 结构化建议
          content:
            application/json:
              schema:
                $ref: './ai_triage_result.schema.json'
        '503':
          $ref: '#/components/responses/Error'
  /internal/v1/wecom/card-actions:
    post:
      summary: 处理企业微信模板卡片按钮事件
      operationId: handleCardAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardAction'
      responses:
        '200':
          description: 返回卡片更新内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardActionResponse'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/accept:
    post:
      summary: 工程师接单
      operationId: acceptTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/start:
    post:
      summary: 开始处理
      operationId: startTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/request-information:
    post:
      summary: 请求申报人补充信息
      operationId: requestTicketInformation
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/resolve:
    post:
      summary: 标记处理完成，等待确认
      operationId: resolveTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/confirm:
    post:
      summary: 申报人确认恢复
      operationId: confirmTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tickets/{ticketId}/actions/reopen:
    post:
      summary: 申报人反馈仍未恢复
      operationId: reopenTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        $ref: '#/components/requestBodies/TicketAction'
      responses:
        '200':
          $ref: '#/components/responses/TicketActionSuccess'
        '409':
          $ref: '#/components/responses/Error'
  /health/live:
    get:
      summary: Liveness
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: WebSocket authenticated and core dependencies ready
        '503':
          description: Not ready
