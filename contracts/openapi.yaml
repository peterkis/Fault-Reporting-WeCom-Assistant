components:
  parameters:
    TicketId:
      in: path
      name: ticketId
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    TicketAction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TicketActionRequest'
  responses:
    TicketActionSuccess:
      description: Action executed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TicketActionResponse'
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LocalDate:
      $ref: './local_date.schema.json'
    LocalTime:
      $ref: './local_time.schema.json'
    LocalDateTime:
      $ref: './local_datetime.schema.json'
    PhysicalEpochMs:
      $ref: './epoch_ms_string.schema.json'
    NormalizedWeComMessage:
      $ref: './normalized_wecom_message.schema.json'
    IntakeResponse:
      type: object
      required: [trace_id, duplicate, intake_id]
      properties:
        trace_id:
          type: string
        duplicate:
          type: boolean
        intake_id:
          type: string
          format: uuid
        ticket_id:
          type: [string, 'null']
          format: uuid
        ticket_no:
          type: [string, 'null']
        external_status:
          type: [string, 'null']
        reply:
          type: [object, 'null']
          additionalProperties: true
    MediaRegistration:
      type: object
      required: [object_key, mime_type, size_bytes, sha256, security_scan_status]
      properties:
        object_key:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
        security_scan_status:
          enum: [PENDING, PASSED, REJECTED, FAILED]
        sensitivity_level:
          enum: [UNKNOWN, INTERNAL, PERSONAL, PATIENT_SENSITIVE, SECRET]
    AITriageRequest:
      type: object
      required: [intake_id, text]
      properties:
        intake_id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 20000
        ocr_text_redacted:
          type: [string, 'null']
          maxLength: 50000
        context:
          type: object
          additionalProperties: true
        catalog_version:
          type: [string, 'null']
    CardAction:
      type: object
      required: [task_id, action_key, actor_wecom_userid, event_req_id]
      properties:
        task_id:
          type: string
        action_key:
          enum: [confirm_resolved, still_broken, add_information, view_ticket, subscribe_incident]
        actor_wecom_userid:
          type: string
        event_req_id:
          type: string
    CardActionResponse:
      type: object
      required: [trace_id, update_card]
      properties:
        trace_id:
          type: string
        update_card:
          type: object
          additionalProperties: true
    TicketActionRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 0
        note:
          type: [string, 'null']
          maxLength: 2000
        external_visible:
          type: boolean
          default: false
        reason_code:
          type: [string, 'null']
        attachment_ids:
          type: array
          items:
            type: string
            format: uuid
    TicketActionResponse:
      type: object
      required: [trace_id, ticket]
      properties:
        trace_id:
          type: string
        ticket:
          type: object
          required: [id, status, version]
          properties:
            id:
              type: string
              format: uuid
            ticket_no:
              type: string
            status:
              type: string
            version:
              type: integer
    ErrorResponse:
      type: object
      required: [trace_id, error]
      properties:
        trace_id:
          type: string
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
