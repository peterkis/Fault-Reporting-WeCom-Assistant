            schema: {"type":"object","additionalProperties":false,"properties":{"client_command_id":{"type":"string","format":"uuid"},"reason_code":{"enum":["OPERATOR_REVIEWED","CONFIRMED_SHARED_FAULT","INCORRECT_ASSOCIATION","RECOVERY_CONFIRMED","SUBSCRIPTION_REQUEST","SCOPE_CORRECTION","MAINTENANCE_EXPIRED","WORKBENCH_CONFIRMED"]},"expected_row_version":{"type":"string","pattern":"^[1-9][0-9]{0,18}$"}},"required":["client_command_id","reason_code","expected_row_version"]}
