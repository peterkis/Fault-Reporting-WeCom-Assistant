  /api/incident-candidates/{candidateId}/confirm:
    post:
      summary: P2-012 CONFIRM_INCIDENT（显式人工命令）
      x-feature-flag: INCIDENT_CORRELATION_ENABLED
      parameters:
        - {in: path, name: candidateId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: If-Match, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: X-CSRF-Token, description: Required for cookie authentication, schema: {type: string}}
