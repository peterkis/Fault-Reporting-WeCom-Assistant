openapi: 3.1.0
info:
  title: YXX member self-service API
  version: 1.0.0
  description: >
    Local contract for the fixed 医小修 homepage and member-owned Web Request
    flow. This contract does not authorize live OAuth, production database
    access, external notifications, or deployment.
servers:
  - url: /
security:
  - WeComMember: []
paths:
  /api/yixiaoxiu/service-catalog:
    servers: [{url: /}]
    get:
      operationId: yxxSelfServiceCatalog
      security: [{WeComMember: []}]
      description: >
        Same-origin, no-store enabled service choices for current members with
        both self-service and my-reports flags enabled. Version and public names
        only; bounded to 200 services. No queries, body or internal routing fields.
        Catalog unavailability leaves text intake available.
      responses:
        '200': {description: 'Bounded member service catalog', content: {application/json: {schema: {$ref: './yxx_self_service_service_catalog.schema.json'}}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/yixiaoxiu/bootstrap:
    servers: [{url: /}]
    get:
      operationId: yxxSelfServiceBootstrap
      security: [{WeComMember: []}]
      responses:
        '200': {description: 'Member-safe capabilities and CSRF token', content: {application/json: {schema: {$ref: './yxx_self_service_bootstrap.schema.json'}}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/yixiaoxiu/requests:
    servers: [{url: /}]
    post:
      operationId: yxxCreateRequest
      security: [{WeComMember: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/Csrf'}
      x-idempotency-body-header-equality: client_command_id must equal Idempotency-Key
      requestBody: {required: true, content: {application/json: {schema: {$ref: './yxx_self_service_request.schema.json'}}}}
      responses:
        '202': {description: 'Durably accepted Web Request; no Ticket is implied', content: {application/json: {schema: {$ref: '#/components/schemas/AcceptedInitial'}}}}
        '200': {description: 'Idempotent replay of the original receipt', content: {application/json: {schema: {$ref: '#/components/schemas/AcceptedReplay'}}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/Busy'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/yixiaoxiu/my-reports:
    servers: [{url: /}]
    get:
      operationId: yxxListMyReports
      security: [{WeComMember: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {in: query, name: source, schema: {type: string, enum: [WEB, BOT]}}
      responses:
        '200': {description: 'Member-owned Web Requests with optional nullable retained initial text previews (summary max 120, location max 80 characters) and authorized Bot Tickets without text previews', content: {application/json: {schema: {$ref: './yxx_self_service_report_page.schema.json'}}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/yixiaoxiu/requests/{request_ref}:
    servers: [{url: /}]
    get:
      operationId: yxxGetRequest
      security: [{WeComMember: []}]
      parameters:
        - {$ref: '#/components/parameters/RequestRef'}
        - {$ref: '#/components/parameters/IfNoneMatch'}
      responses:
        '200': {description: 'Member-safe request detail', content: {application/json: {schema: {$ref: './yxx_self_service_request_detail.schema.json'}}}}
        '304': {description: 'Authorized unchanged representation'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/yixiaoxiu/requests/{request_ref}/timeline:
    servers: [{url: /}]
    get:
      operationId: yxxGetRequestTimeline
      security: [{WeComMember: []}]
      parameters:
        - {$ref: '#/components/parameters/RequestRef'}
        - {in: query, name: cursor, schema: {type: string, minLength: 10, maxLength: 2048}, x-mutually-exclusive-with: [after, before]}
        - {in: query, name: after, schema: {type: string, pattern: '^[0-9]+$'}, x-mutually-exclusive-with: [before, cursor]}
        - {in: query, name: before, schema: {type: string, pattern: '^[0-9]+$'}, x-mutually-exclusive-with: [after, cursor]}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: 'Member-safe timeline without internal notes or identity', content: {application/json: {schema: {$ref: './yxx_self_service_timeline.schema.json'}}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/yixiaoxiu/requests/{request_ref}/supplements:
    servers: [{url: /}]
    post:
      operationId: yxxSupplementRequest
      security: [{WeComMember: []}]
      parameters:
        - {$ref: '#/components/parameters/RequestRef'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/Csrf'}
      x-idempotency-body-header-equality: client_command_id must equal Idempotency-Key
      requestBody: {required: true, content: {application/json: {schema: {$ref: './yxx_self_service_supplement.schema.json'}}}}
      responses:
        '202': {description: 'Durably accepted supplement', content: {application/json: {schema: {$ref: '#/components/schemas/AcceptedInitial'}}}}
        '200': {description: 'Idempotent replay of the supplement receipt', content: {application/json: {schema: {$ref: '#/components/schemas/AcceptedReplay'}}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/Busy'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/yixiaoxiu/commands/{client_command_id}:
    servers: [{url: /}]
    get:
      operationId: yxxGetMyCommand
      security: [{WeComMember: []}]
      parameters:
        - {in: path, name: client_command_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'Current member-owned command receipt', content: {application/json: {schema: {$ref: './yxx_self_service_receipt.schema.json'}}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /wecom/yixiaoxiu/:
    servers: [{url: /}]
    get:
      operationId: getYxxSelfServiceHome
      security: [{}, {WeComMember: []}]
      description: 'The fixed homepage. It retains the existing prompt when the self-service profile or flags are disabled.'
      parameters: [{in: query, name: auth_return, schema: {type: string, const: '1'}, description: 'Internal one-use return marker; no identity or authorization data.'}]
      responses: {'200': {description: 'Prompt or self-service home'}, '302': {description: 'One bounded OAuth begin'}, '303': {description: 'Normalize the exact auth_return marker to the bare root'}, '401': {description: 'Terminal authentication prompt'}, '403': {description: 'Member permission denied'}, '503': {description: 'Fail closed'}}
  /wecom/yixiaoxiu/reports/new:
    servers: [{url: /}]
    get: {operationId: openYxxNewReport, security: [{WeComMember: []}], responses: {'200': {description: 'Native form'}, '302': {description: 'Bounded OAuth begin; returns to the fixed homepage'}, '401': {description: 'Authentication required'}, '403': {description: 'Member permission denied'}, '503': {description: 'Disabled'}}}
  /wecom/yixiaoxiu/reports:
    servers: [{url: /}]
    get: {operationId: openYxxReports, security: [{WeComMember: []}], responses: {'200': {description: 'Native member report list'}, '302': {description: 'Bounded OAuth begin; returns to the fixed homepage'}, '401': {description: 'Authentication required'}, '403': {description: 'Member permission denied'}, '503': {description: 'Disabled'}}}
  /wecom/yixiaoxiu/reports/{request_ref}:
    servers: [{url: /}]
    get: {operationId: openYxxReport, security: [{WeComMember: []}], parameters: [{ $ref: '#/components/parameters/RequestRef'}], responses: {'200': {description: 'Native safe detail'}, '302': {description: 'Bounded OAuth begin; returns to the fixed homepage'}, '401': {description: 'Authentication required'}, '403': {description: 'Member permission denied'}, '404': {description: 'Not found or not owned'}, '503': {description: 'Disabled'}}}
components:
  securitySchemes:
    WeComMember: {type: apiKey, in: cookie, name: __Host-wecom_session}
  parameters:
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, format: uuid}}
    Csrf: {in: header, name: X-CSRF-Token, required: true, schema: {type: string, minLength: 32, maxLength: 128}}
    Cursor: {in: query, name: cursor, schema: {type: string, minLength: 10, maxLength: 2048}}
    RequestRef: {in: path, name: request_ref, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{32}$'}}
    IfNoneMatch: {in: header, name: If-None-Match, schema: {type: string, maxLength: 256}}
  schemas:
    YxxSelfServiceProfile: {$ref: './yxx_self_service_profile.schema.json'}
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [ok, replayed, receipt, location]
      properties:
        ok: {const: true}
        replayed: {type: boolean}
        receipt: {$ref: './yxx_self_service_receipt.schema.json'}
        location: {type: string, pattern: '^/wecom/yixiaoxiu/reports/[A-Za-z0-9_-]{32}$'}
    AcceptedInitial:
      allOf: [{ $ref: '#/components/schemas/AcceptedResponse' }, { type: object, properties: { replayed: { const: false } } }]
    AcceptedReplay:
      allOf: [{ $ref: '#/components/schemas/AcceptedResponse' }, { type: object, properties: { replayed: { const: true } } }]
    Error: {$ref: './yxx_self_service_error.schema.json'}
  responses:
    Invalid: {description: 'Closed input, cursor, content type, or origin error', content: {application/json: {schema: {$ref: './yxx_self_service_error.schema.json'}}}}
    AuthRequired: {description: 'Current member authentication required', content: {application/json: {schema: {$ref: './yxx_self_service_error.schema.json'}}}}
    Forbidden: {description: 'Profile, member, CSRF, or origin denied', content: {application/json: {schema: {$ref: './yxx_self_service_error.schema.json'}}}}
    NotFound: {description: 'Not owned, revoked, expired, or unknown; no existence disclosure', content: {application/json: {schema: {$ref: './yxx_self_service_error.schema.json'}}}}
    Conflict: {description: 'Command hash or input revision conflict', content: {application/json: {schema: {$ref: './yxx_self_service_error.schema.json'}}}}
    TooLarge: {description: 'Body exceeds the route limit', content: {application/json: {schema: {$ref: './yxx_self_service_error.schema.json'}}}}
    Busy: {description: 'Bounded concurrency or rate limit', content: {application/json: {schema: {$ref: './yxx_self_service_error.schema.json'}}}}
    Unavailable: {description: 'Configuration, database, or processor unavailable', content: {application/json: {schema: {$ref: './yxx_self_service_error.schema.json'}}}}
