</head><body class="bg-surface text-text-main min-h-screen flex flex-col antialiased selection:bg-primary/20 selection:text-primary"><header class="fixed top-0 w-full z-50 pt-safe bg-[#faf9f8]/90 backdrop-blur-md border-b border-black/[0.06]"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-2.5 min-w-0"><div class="w-9 h-9 rounded-lg bg-primary flex items-center justify-center flex-shrink-0 text-white font-bold text-[16px] shadow-sm select-none">修</div><div class="flex flex-col min-w-0 justify-center"><div class="flex items-center gap-1.5"><span class="font-semibold text-[15px] tracking-tight text-text-main truncate">医小修</span><span class="inline-flex items-center px-1.5 py-0.5 text-[11px] rounded bg-tint-mint text-success font-medium leading-none">在线</span></div><div class="flex items-center gap-0.5 text-on-surface-variant text-[12px] cursor-pointer hover:text-text-main transition-colors"><span class="truncate">本部院区</span><span class="material-symbols-outlined text-[14px]">arrow_drop_down</span></div></div></div><div class="flex items-center gap-1.5 flex-shrink-0"><button aria-label="搜索与帮助" class="w-8 h-8 flex items-center justify-center rounded-md text-on-surface-variant hover:text-text-main hover:bg-black/[0.04] transition-colors"></button></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-24 bg-surface"><div class="flex flex-col w-full px-margin py-3 gap-3">

</div>

</div>
</div>

<span class="font-semibold text-[16px] text-text-main tracking-tight" id="mic-text">按住大声说 · 语音倾诉报修</span>

</div>
<div class="w-full mt-3 py-1.5 px-3 rounded-md bg-[#455dd3]/10 text-primary text-[12px] flex items-center justify-center gap-1.5 hidden" id="voice-wave">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="">正在收音与语义分析中...&nbsp;</span>
</div>
</div>
<!-- 2. Dual Fast Multi-modal Buttons (Photo/OCR & Video) -->
<div class="grid grid-cols-2 gap-2.5">
<!-- Screen/Photo Auto Detection Button -->
<button class="flex items-center gap-2.5 p-3 rounded-lg bg-white shadow-[0_1px_2px_rgba(0,0,0,0.03)] border border-black/[0.06] active:scale-95 transition-all text-left hover:bg-black/[0.02] group" id="photo-upload-btn" type="button">
<div class="w-10 h-10 rounded-lg bg-tint-peach flex items-center justify-center text-[#d97706] flex-shrink-0 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[22px]">document_scanner</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-medium text-[13px] text-text-main truncate">拍照&nbsp;&nbsp;</span>
<span class="text-[11px] text-on-surface-variant truncate">拍蓝屏或弹窗代码</span>
</div>
</button>
<!-- Short Video Button -->
<button class="flex items-center gap-2.5 p-3 rounded-lg bg-white shadow-[0_1px_2px_rgba(0,0,0,0.03)] border border-black/[0.06] active:scale-95 transition-all text-left hover:bg-black/[0.02] group" id="video-capture-btn" type="button">
<div class="w-10 h-10 rounded-lg bg-tint-sky flex items-center justify-center text-secondary flex-shrink-0 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[22px]">videocam</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-medium text-[13px] text-text-main truncate">录像</span>
<span class="text-[11px] text-on-surface-variant truncate">记录卡纸与硬件杂音</span>
</div>
</button>

<div class="flex items-center justify-between px-1 text-on-surface-variant">

<span class="">补充文字描述 (选填)</span>
</div>
<span class="text-[11px] text-on-surface-variant" id="char-counter">30/150</span>
</div>
<textarea class="w-full bg-white rounded-md p-2 text-text-main text-[13px] border border-black/[0.06] focus:outline-none focus:border-primary placeholder:text-on-surface-variant/60 resize-none" id="fault-desc" placeholder="如需补充房间号、其他异常表现或期望到达时间可在此输入..." rows="2"></textarea>
</div>
</div>
<!-- Classification Quick Tag Selectors -->

<!-- Urgency Toggle (Calm Clinical Triage) -->

<!-- Submitter Contact Verification Card -->

<!-- Friendly Clinical Tip -->
<div class="rounded-xl bg-white border border-black/[0.06] shadow-[0_1px_2px_rgba(0,0,0,0.03)] p-3 flex flex-col gap-2 transition-all"><div class="flex items-center justify-between"><div class="flex items-center gap-1.5 text-[12px] font-medium text-text-main"><span class="material-symbols-outlined text-[16px] text-primary">location_on</span><span class="">位置</span></div><span class="text-[11px] text-primary/80 font-medium px-1.5 py-0.5 rounded bg-primary/10">选填</span></div><div class="flex items-center gap-2 bg-[#faf9f8] border border-black/[0.06] rounded-lg px-2.5 py-2 cursor-pointer hover:border-primary/40 transition-colors"><div class="flex-1 flex flex-col min-w-0"><div class="flex items-center gap-1.5 text-[13px] font-medium text-text-main truncate"></div><span class="text-[11px] text-on-surface-variant truncate mt-0.5">可点击补充精准位置，如：12床床旁、配药间电脑</span></div><span class="material-symbols-outlined text-[18px] text-on-surface-variant flex-shrink-0">edit_location_alt</span></div></div>

</button>

<!-- Success Toast Modal Mock (Hidden initially) -->
<div class="hidden fixed inset-x-4 bottom-20 p-3.5 rounded-lg bg-[#191918] text-white shadow-xl flex items-center justify-between z-50 transition-all border border-white/10" id="toast-success">
<div class="flex items-center gap-2.5">
<span class="material-symbols-outlined text-[#34c759] text-[20px]">task_alt</span>
<div class="flex flex-col">
<span class="text-[13px] font-medium text-white">报修单 #CL-8921 提交成功</span>
<span class="text-[11px] text-white/70">心内科值班工程师 王工 已自动接收</span>
</div>
</div>

</div>

<script>
  (function() {
    const desc = document.getElementById('fault-desc');
    const counter = document.getElementById('char-counter');
    const voiceBtn = document.getElementById('voice-record-btn');
    const voiceWave = document.getElementById('voice-wave');
    const micText = document.getElementById('mic-text');
    const chips = document.querySelectorAll('.category-chip');
    const urgencyBtns = document.querySelectorAll('.urgency-btn');
    const submitBtn = document.getElementById('submit-ticket-btn');
    const toast = document.getElementById('toast-success');
    const removeEvidence = document.getElementById('remove-evidence');
    const evidenceCard = document.getElementById('ocr-preview-card');

    if (desc && counter) {
      desc.addEventListener('input', () => {
        counter.textContent = `${desc.value.length}/150`;
      });
    }

    let isRecording = false;
    if (voiceBtn) {
      voiceBtn.addEventListener('click', () => {
        isRecording = !isRecording;
        if (isRecording) {
          voiceWave.classList.remove('hidden');
          micText.textContent = '正在倾听...';
          voiceBtn.classList.add('border-primary');
          if (desc && !desc.value) {
            desc.value = '3号医生站电脑无法启动，按下电源键黑屏，急需开具12床医嘱。';
            counter.textContent = `${desc.value.length}/150`;
          }
        } else {
          voiceWave.classList.add('hidden');
          micText.textContent = '按住大声说 · 语音倾诉报修';
          voiceBtn.classList.remove('border-primary');
        }
      });
    }

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => {
          c.classList.remove('bg-primary', 'text-white', 'border-primary');
          c.classList.add('bg-white', 'text-on-surface-variant', 'border-black/[0.06]');
        });
        chip.classList.remove('bg-white', 'text-on-surface-variant', 'border-black/[0.06]');
        chip.classList.add('bg-primary', 'text-white', 'border-primary');
      });
    });

    urgencyBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        urgencyBtns.forEach(b => {
          b.classList.remove('bg-white', 'text-text-main', 'shadow-sm', 'border-black/[0.04]');
          b.classList.add('bg-transparent', 'text-on-surface-variant', 'border-transparent');
        });
        btn.classList.add('bg-white', 'text-text-main', 'shadow-sm', 'border-black/[0.04]');
        btn.classList.remove('bg-transparent', 'text-on-surface-variant', 'border-transparent');
      });
    });

    if (removeEvidence && evidenceCard) {
      removeEvidence.addEventListener('click', () => {
        evidenceCard.classList.add('hidden');
      });
    }

    if (submitBtn && toast) {
      submitBtn.addEventListener('click', () => {
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-80');
        submitBtn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span> <span>派工同步中...</span>`;
        
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-80');
          submitBtn.innerHTML = `<span class="material-symbols-outlined text-[18px]">check</span> <span>已完成提交</span>`;
          toast.classList.remove('hidden');
          setTimeout(() => {
            toast.classList.add('hidden');
          }, 4000);
        }, 800);
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-[#faf9f8]/90 backdrop-blur-md border-t border-black/[0.06]"><div class="h-14 px-space-md flex items-center justify-around"><a class="flex flex-col items-center justify-center min-w-[56px] h-11 gap-0.5 text-on-surface-variant hover:text-text-main transition-colors active:scale-95" data-path="workbench" href="#"><span class="material-symbols-outlined text-[20px]">dashboard_customize</span><span class="text-[11px] font-medium tracking-tight">工作台</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] h-11 gap-0.5 transition-colors active:scale-95 text-primary font-semibold" data-path="quick-report" href="#"><span class="material-symbols-outlined text-[20px]">bolt</span><span class="text-[11px] tracking-tight">快捷报修</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-11 gap-0.5 text-on-surface-variant hover:text-text-main transition-colors active:scale-95" data-path="ticket-records" href="#"><span class="material-symbols-outlined text-[20px]">receipt_long</span><span class="text-[11px] font-medium tracking-tight">工单查询</span></a></div></nav>
