name: Execute the planned PR checks
description: One candidate build, existing routed tests and conditional resource preparation
inputs:
  base:
    description: Full PR base commit
    required: true
  head:
    description: Full checked-out PR head commit
    required: true
  database:
    description: Whether the selected entries require the isolated database
    required: true
  browser:
    description: Whether the selected entries require a system browser
    required: true
  pyyaml:
    description: Whether the selected entries or tool checks require PyYAML
    required: true
  ffmpeg:
    description: Whether the selected entries require ffmpeg and ffprobe
    required: true
runs:
  using: composite
  steps:
  - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
    with:
      node-version: '24'
      cache: npm
  - run: git config --local core.autocrlf true
    shell: bash
  - run: npm ci --ignore-scripts --no-audit --no-fund
    shell: bash
  - if: ${{ inputs.pyyaml == 'true' }}
    run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
    shell: bash
  - name: Prepare pinned Chrome for browser tests
    if: ${{ inputs.browser == 'true' }}
    shell: bash
    run: |
      set -euo pipefail
      browser_version=144.0.7559.59
      browser_dir="$RUNNER_TEMP/pr-chrome"
      mkdir -p "$browser_dir"
      curl --fail --location --retry 3 --output "$browser_dir/chrome.zip" \
        "https://storage.googleapis.com/chrome-for-testing-public/$browser_version/linux64/chrome-linux64.zip"
      unzip -q "$browser_dir/chrome.zip" -d "$browser_dir"
      BROWSER_PATH="$browser_dir/chrome-linux64/chrome"
      test -x "$BROWSER_PATH"
      sandbox="$browser_dir/chrome-linux64/chrome_sandbox"
      test -f "$sandbox"
      sudo install -o root -g root -m 4755 "$sandbox" "$browser_dir/chrome-linux64/chrome-sandbox"
      "$BROWSER_PATH" --version | grep -F "$browser_version"
      timeout 20s "$BROWSER_PATH" --headless=new --disable-gpu --no-first-run \
        --user-data-dir="$browser_dir/sandbox-probe" --dump-dom about:blank | grep -F '<html>'
      echo "TS_MIGRATION_BROWSER_EXECUTABLE=$BROWSER_PATH" >> "$GITHUB_ENV"
  - name: Prepare selected media tools
    if: ${{ inputs.ffmpeg == 'true' }}
    shell: bash
    run: |
      set -euo pipefail
      if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg
      fi
      printf 'H5_MEDIA_FFMPEG=%s\nH5_MEDIA_FFPROBE=%s\n' "$(command -v ffmpeg)" "$(command -v ffprobe)" >> "$GITHUB_ENV"
  - name: One application build and strict gates
    shell: bash
    run: |
      set -euo pipefail
      mkdir -p "$RUNNER_TEMP/pr-check"
      npm run migration:build 2>&1 | tee "$RUNNER_TEMP/pr-check/build.txt"
      node .build/tools/gate.mjs types 2>&1 | tee "$RUNNER_TEMP/pr-check/types.txt"
      node .build/tools/check-agent-docs.mjs
  - name: Initialize only the selected isolated database
    if: ${{ inputs.database == 'true' }}
    shell: bash
    run: node .build/runtime/app/server/scripts/migrate-current-baseline.mjs
  - name: Run the union through the existing API, without a CLI rebuild
    shell: bash
    env:
      EXPECTED_BASE: ${{ inputs.base }}
      EXPECTED_HEAD: ${{ inputs.head }}
    run: |
      set -euo pipefail
      node .build/tools/pr-plan.mjs --base "$EXPECTED_BASE" --head "$EXPECTED_HEAD" --out "$RUNNER_TEMP/pr-check/plan.json" --run --report-dir "$RUNNER_TEMP/pr-check/tests" 2>&1 | tee "$RUNNER_TEMP/pr-check/tests.txt"
      if node -e "const p=require(process.argv[1]);process.exit(p.profiles.includes('policy')?0:1)" "$RUNNER_TEMP/pr-check/plan.json"; then
        node --test --test-name-pattern 'retired T02 replay' .build/tools/t02-expiry.test.mjs 2>&1 | tee "$RUNNER_TEMP/pr-check/scheduling.txt"
      fi
  - name: Verify the selected database has no residual test databases
    if: ${{ always() && inputs.database == 'true' }}
    shell: bash
    run: |
      set -euo pipefail
      mkdir -p "$RUNNER_TEMP/pr-check"
      node --input-type=module -e "import pg from 'pg';const p=new pg.Pool({connectionString:process.env.PILOT_DATABASE_URL});try{const r=await p.query(\"SELECT datname FROM pg_database WHERE datname NOT IN ('postgres','template0','template1','migration_ci')\");console.log(JSON.stringify({remaining_databases:r.rows}));if(r.rowCount)process.exitCode=1;}finally{await p.end();}" 2>&1 | tee "$RUNNER_TEMP/pr-check/database-cleanup.txt"
  - name: Verify exact artifact and source after all selected checks
    if: always()
    shell: bash
    run: |
      set -euo pipefail
      mkdir -p "$RUNNER_TEMP/pr-check"
      git rev-parse HEAD > "$RUNNER_TEMP/pr-check/source-sha.txt"
      node --version > "$RUNNER_TEMP/pr-check/node-version.txt"
      node .build/tools/verify-artifact.mjs > "$RUNNER_TEMP/pr-check/artifact.txt" 2>&1
      cp .build/artifact-proof.json .build/runtime/build-manifest.json "$RUNNER_TEMP/pr-check/"
      git diff --exit-code
      test -z "$(git status --porcelain)"
  - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
    if: always()
    with:
      name: pr-check-${{ github.run_id }}
      path: ${{ runner.temp }}/pr-check/
      retention-days: 14
