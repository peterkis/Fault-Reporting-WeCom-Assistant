name: SS009 evidence immutability
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options:
        - certify
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'pr' }}
  cancel-in-progress: true
jobs:
  evidence-history:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
      GIT_NO_REPLACE_OBJECTS: '1'
    steps:
    - name: Preserve the recorded checkout line endings
      run: |
        git config --global core.autocrlf true
        git config --global core.longpaths true
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - run: git config --local core.autocrlf true
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Verify the exact published object
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ss009-evidence-history"
        node .github/review/verify-published-history.mjs --expected-head "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/ss009-evidence-history/preflight.json"
    - name: Check this PR evidence history without project dependencies
      run: |
        set -euo pipefail
        node --test .github/review/pr-evidence-delta.test.mjs
        node .github/review/pr-evidence-delta.mjs | tee "$RUNNER_TEMP/ss009-evidence-history/pr-delta.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: pr-evidence-delta-${{ github.run_id }}
        path: ${{ runner.temp }}/ss009-evidence-history/
        retention-days: 14
  historical-certify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'certify' }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      SS009_FIXTURE: 41edd855e7bc55149facb6a4b2e0076776c22e66
      SS009_BASE: 375d47b013017edb858206cc5f3475c9aed77dfd
      GIT_NO_REPLACE_OBJECTS: '1'
    steps:
    - name: Preserve the recorded checkout line endings
      run: |
        git config --global core.autocrlf true
        git config --global core.longpaths true
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - run: git config --local core.autocrlf true
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Verify the exact published object
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ss009-evidence-history"
        node .github/review/verify-published-history.mjs --expected-head "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/ss009-evidence-history/preflight.json"
    - name: Prepare the YAML parser required by current and historical OpenAPI tests
      run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
    - run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Reconstruct the published SS009 fixture with its original frozen scope
      run: |
        set -euo pipefail
        git merge-base --is-ancestor "$SS009_FIXTURE" "$EXPECTED_HEAD"
        git clone --shared --no-checkout --config core.autocrlf=true . "$RUNNER_TEMP/ss009-frozen"
        git -C "$RUNNER_TEMP/ss009-frozen" checkout --detach "$SS009_FIXTURE"
        git -C "$RUNNER_TEMP/ss009-frozen" update-ref refs/remotes/origin/main "$SS009_BASE"
    - run: npm ci --ignore-scripts --no-audit --no-fund
      working-directory: ${{ runner.temp }}/ss009-frozen
    - name: Verify historical fixture identity and unchanged strict readiness
      working-directory: ${{ runner.temp }}/ss009-frozen
      run: |
        set -euo pipefail
        node .github/review/verify-published-history.mjs --expected-head "$SS009_FIXTURE" | tee "$RUNNER_TEMP/ss009-evidence-history/historical-preflight.json"
        node scripts/validate-yxx-self-service.mjs --require-ready | tee "$RUNNER_TEMP/ss009-evidence-history/historical-strict.json"
    - name: Run the original SS009 evidence and immutable-history tests
      working-directory: ${{ runner.temp }}/ss009-frozen
      run: |
        set -euo pipefail
        node --test --test-reporter=tap tests/yxx-ss-008-validation-scope.test.mjs tests/yxx-ss-009-evidence.test.mjs tests/yxx-ss-009-evidence-history.test.mjs tests/yxx-ss-009-governance.test.mjs | tee "$RUNNER_TEMP/ss009-evidence-history/unit.tap"
    - name: Reproduce historical r6 bypass and require rejection in all validator modes
      working-directory: ${{ runner.temp }}/ss009-frozen
      run: |
        set -euo pipefail
        node .github/review/ss009-evidence-history-probe.mjs | tee "$RUNNER_TEMP/ss009-evidence-history/r6-rewrite-probe.json"
    - name: Run the unchanged architecture and structure checks
      working-directory: ${{ runner.temp }}/ss009-frozen
      run: |
        set -euo pipefail
        node scripts/validate-yxx-self-service.mjs | tee "$RUNNER_TEMP/ss009-evidence-history/structure.json"
        node --input-type=module -e '
          import assert from "node:assert/strict";
          import {spawnSync} from "node:child_process";
          import {SS009_VALIDATORS} from "./src/yxx-self-service-verification.mjs";
          for(const file of SS009_VALIDATORS){
            const r=spawnSync(process.execPath,["scripts/"+file],{encoding:"utf8"});
            console.log(JSON.stringify({command:file,exit_code:r.status,stdout:r.stdout,stderr:r.stderr}));
            assert.ifError(r.error);assert.equal(r.status,0,file);
          }' | tee "$RUNNER_TEMP/ss009-evidence-history/validators.jsonl"
    - name: Retain current and historical results, including failures
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ss009-evidence-history-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ss009-evidence-history/
        retention-days: 30
