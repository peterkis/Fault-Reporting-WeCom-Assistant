name: SS009 evidence immutability
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  evidence-history:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      GIT_NO_REPLACE_OBJECTS: '1'
    steps:
      - name: Preserve the recorded checkout line endings
        run: git config --global core.autocrlf true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: git config --local core.autocrlf true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify the exact published object
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ss009-evidence-history"
          node .github/review/verify-published-history.mjs --expected-head "$EXPECTED_HEAD" | tee "$RUNNER_TEMP/ss009-evidence-history/preflight.json"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run existing evidence and new immutable-history tests
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/yxx-ss-009-evidence.test.mjs tests/yxx-ss-009-evidence-history.test.mjs | tee "$RUNNER_TEMP/ss009-evidence-history/unit.tap"
      - name: Reproduce the genuine r6 bypass and require rejection in every current mode
        run: |
          set -euo pipefail
          node .github/review/ss009-evidence-history-probe.mjs | tee "$RUNNER_TEMP/ss009-evidence-history/r6-rewrite-probe.json"
      - name: Run the unchanged architecture and structure checks
        run: |
          set -euo pipefail
          node scripts/validate-yxx-self-service.mjs | tee "$RUNNER_TEMP/ss009-evidence-history/structure.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {spawnSync} from "node:child_process";
            import {SS009_VALIDATORS} from "./src/yxx-self-service-verification.mjs";
            for(const file of SS009_VALIDATORS){
              const r=spawnSync(process.execPath,["scripts/"+file],{encoding:"utf8"});
              console.log(JSON.stringify({command:file,exit_code:r.status,stdout:r.stdout,stderr:r.stderr}));
              assert.ifError(r.error);assert.equal(r.status,0,file);
            }' | tee "$RUNNER_TEMP/ss009-evidence-history/validators.jsonl"
      - name: Retain scoped results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ss009-evidence-history-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ss009-evidence-history/
          retention-days: 30
