name: TypeScript migration
on:
  pull_request:
  push:
    branches: ['codex/typescript-t01-foundation', 'codex/typescript-t02-hosts', 'codex/typescript-t03-prerequisite', 'codex/typescript-t03-platform']
permissions:
  contents: read
jobs:
  tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Preserve the recorded current-source SQL checkout representation
        run: git config --global core.autocrlf true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain checkout line endings for hermetic Git preflight
        run: git config --local core.autocrlf true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare the YAML parser required by current and historical OpenAPI tests
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authentic merged T02 reference (never current TypeScript source)
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/types-t02-reference"
          git clone --no-local --config core.autocrlf=true . "$BASE"
          git -C "$BASE" checkout --detach 7eefaa99591bfaa2e787701efd315ff701c51f35
          git -C "$BASE" update-ref refs/remotes/origin/main 7eefaa99591bfaa2e787701efd315ff701c51f35
          npm ci --prefix "$BASE" --ignore-scripts --no-audit --no-fund
      - name: Strict tools, real compiler canary and host rejection tests
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/types-review"
          mkdir -p "$OUT"
          npm run migration:gate 2>&1 | tee "$OUT/gate.txt"
          node --test --test-reporter=tap .build/tools/tooling.test.mjs .build/tools/hosts.test.mjs .build/tools/batches.test.mjs 2>&1 | tee "$OUT/tooling.txt"
          node .build/tools/observe-runtime.mjs "$RUNNER_TEMP/types-t02-reference" 2>&1 | tee "$OUT/observations.jsonl"
          node .build/tools/check-g2.mjs 2>&1 | tee "$OUT/g2-identity.jsonl"
          node .build/tools/browser-smoke.mjs 2>&1 | tee "$OUT/real-browser.txt"
          node .build/tools/run-tests.mjs --selection t02-source --report-dir "$OUT/source" 2>&1 | tee "$OUT/source.txt"
          node .build/tools/run-tests.mjs --selection t02-time --report-dir "$OUT/time" 2>&1 | tee "$OUT/time.txt"
          npm run migration:verify-artifact 2>&1 | tee "$OUT/artifact.txt"
          cp .build/artifact-proof.json .build/runtime/build-manifest.json "$OUT/"
          git rev-parse HEAD > "$OUT/source-sha.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: types-tooling-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/types-review/
          retention-days: 14
  source-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: migration_ci_only
          POSTGRES_DB: migration_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TS_MIGRATION_TEST_DB_ISOLATED: '1'
      PILOT_DATABASE_URL: postgresql://postgres:migration_ci_only@127.0.0.1:5432/migration_ci
    steps:
      - name: Preserve the recorded current-source SQL checkout representation
        run: git config --global core.autocrlf true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain checkout line endings for hermetic Git preflight
        run: git config --local core.autocrlf true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare the YAML parser required by current and historical OpenAPI tests
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authentic merged T02 reference (never current TypeScript source)
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/types-t02-reference"
          git clone --no-local --config core.autocrlf=true . "$BASE"
          git -C "$BASE" checkout --detach 7eefaa99591bfaa2e787701efd315ff701c51f35
          git -C "$BASE" update-ref refs/remotes/origin/main 7eefaa99591bfaa2e787701efd315ff701c51f35
          npm ci --prefix "$BASE" --ignore-scripts --no-audit --no-fund
      - name: Same 17-file baseline on SOURCE then two independent shadows
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/types-baseline"
          mkdir -p "$OUT"
          node .github/review/verify-published-history.mjs --expected-head "$EXPECTED_HEAD" 2>&1 | tee "$OUT/identity.txt"
          npm run migration:tools
          (cd "$RUNNER_TEMP/types-t02-reference" && npm run migration:tools && node .build/tools/run-tests.mjs --selection t02-baseline --reference-source --report-dir "$OUT/reference") 2>&1 | tee "$OUT/reference.txt"
          node .build/tools/run-tests.mjs --selection t02-baseline --report-dir "$OUT/shadow-1" 2>&1 | tee "$OUT/shadow-1.txt"
          node .build/tools/run-tests.mjs --selection t02-baseline --report-dir "$OUT/shadow-2" 2>&1 | tee "$OUT/shadow-2.txt"
          node .build/tools/observe-runtime.mjs "$RUNNER_TEMP/types-t02-reference" 2>&1 | tee "$OUT/observations.jsonl"
      - name: Observe untouched T02 P2-005 cleanup (diagnostic only)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/types-baseline"
          RC=0
          (cd "$RUNNER_TEMP/types-t02-reference" && node --test --test-reporter=tap --test-concurrency=1 tests/p2-005-conversation-control.integration.test.mjs) > "$OUT/t02-cleanup-observation.txt" 2>&1 || RC=$?
          echo "$RC" > "$OUT/t02-cleanup-observation-exit.txt"
          echo "REFERENCE_OBSERVATION_ONLY exit=$RC; not current acceptance"
      - name: Entire T03 dependency batch on real PG18 and browser hosts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/types-baseline"
          if ! npm run migration:gate -- --batch T03-01 --report-dir "$OUT/t03-batch" > "$OUT/t03-batch.txt" 2>&1; then
            tail -n 100 "$OUT/t03-batch.txt"
            exit 1
          fi
      - name: T02 artifact identity and source architecture
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/types-baseline"
          node .build/tools/check-g2.mjs 2>&1 | tee "$OUT/g2-identity.jsonl"
          cp .build/artifact-proof.json .build/runtime/build-manifest.json "$OUT/"
          npm run validate:architecture:v1.4 2>&1 | tee "$OUT/architecture.txt"
      - name: T02 frozen P2-016 checkout
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/types-baseline"
          node .build/tools/run-tests.mjs --frozen p2016 --report-dir "$OUT/historical" 2>&1 | tee "$OUT/historical.txt"
      - name: Compare unchanged known non-readiness against authentic merged T02
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/types-baseline"
          BASE="$RUNNER_TEMP/types-t02-reference"
          printf '%s\n' "import net from 'node:net';import cp from 'node:child_process';import {syncBuiltinESMExports} from 'node:module';const fail=()=>{process.stderr.write('T02_FORBIDDEN_RUNTIME_IO');process.exit(97);};net.Socket.prototype.connect=fail;net.Server.prototype.listen=fail;cp.fork=fail;cp.spawn=fail;globalThis.fetch=fail;syncBuiltinESMExports();" > "$OUT/offline-guard.mjs"
          npm ci --prefix "$BASE" --ignore-scripts --no-audit --no-fund
          for LABEL in current base; do
            CWD="$GITHUB_WORKSPACE"; if [ "$LABEL" = base ]; then CWD="$BASE"; fi
            HOOK=(); if [ "$LABEL" = current ]; then HOOK=(--import "$GITHUB_WORKSPACE/.build/tools/source-hook.mjs"); fi
            RC=0; (cd "$CWD" && node scripts/validate-yxx-self-service.mjs --require-ready) > "$OUT/$LABEL-strict.txt" 2>&1 || RC=$?
            echo "$RC" > "$OUT/$LABEL-strict-exit.txt"; test "$RC" = 1
            grep -q YXX_VERIFICATION_REJECTED "$OUT/$LABEL-strict.txt"
            (cd "$CWD" && node "${HOOK[@]}" --input-type=module -e "import {validateYxxSelfService} from './src/yxx-self-service-verification.mjs'; try {validateYxxSelfService({root:process.cwd(),requireReady:true}); process.exitCode=1;} catch(e) {if(e.code!=='YXX_LOCAL_VALIDATION_SCOPE_INVALID')throw e; console.log(JSON.stringify({status:'KNOWN_BASELINE_NOT_READY',code:e.code}));}") > "$OUT/$LABEL-strict-classification.txt" 2>&1
            RC=0; (cd "$CWD" && node --import "$OUT/offline-guard.mjs" scripts/yxx-self-service-readiness.mjs) > "$OUT/$LABEL-ss010.txt" 2>&1 || RC=$?
            echo "$RC" > "$OUT/$LABEL-ss010-exit.txt"; test "$RC" = 1
            grep -q 'SS010_NOT_READY' "$OUT/$LABEL-ss010.txt"
            (cd "$CWD" && node "${HOOK[@]}" --import "$OUT/offline-guard.mjs" --input-type=module -e "import {checkSS010} from './src/yxx-self-service-readiness.mjs'; try{checkSS010({root:process.cwd()});process.exitCode=1;}catch(e){if(e.code!=='YXX_LOCAL_VALIDATION_SCOPE_INVALID')throw e;console.log(e.code);}") > "$OUT/$LABEL-ss010-internal.txt" 2>&1
            RC=0; (cd "$CWD" && node scripts/validate-arch-006-rule-first-service-loop.mjs) > "$OUT/$LABEL-arch006.txt" 2>&1 || RC=$?
            echo "$RC" > "$OUT/$LABEL-arch006-exit.txt"; test "$RC" = 1
          done
          cmp "$OUT/current-ss010-internal.txt" "$OUT/base-ss010-internal.txt"
          cmp "$OUT/current-ss010.txt" "$OUT/base-ss010.txt"
          cmp "$OUT/current-arch006.txt" "$OUT/base-arch006.txt"
          grep -q 'ARCH-006 validation failed with 2 error(s)' "$OUT/current-arch006.txt"
          grep -q 'valid pinned local self-service successor scope' "$OUT/current-arch006.txt"
          cmp "$OUT/current-strict-classification.txt" "$OUT/base-strict-classification.txt"
      - name: Exact source, environment and cleanup identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/types-baseline"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-sha.txt"
          git archive --format=tar HEAD | gzip > "$OUT/source.tar.gz"
          git bundle create "$OUT/source.bundle" HEAD
          node --version > "$OUT/node-version.txt"
          node --input-type=module -e "import pg from 'pg'; const p=new pg.Pool({connectionString:process.env.PILOT_DATABASE_URL});try{const r=await p.query(\"SELECT datname FROM pg_database WHERE datname NOT IN ('postgres','template0','template1','migration_ci')\");console.log(JSON.stringify({remaining_databases:r.rows}));if(r.rowCount)process.exitCode=1;console.log((await p.query('SHOW server_version')).rows);}finally{await p.end();}" 2>&1 | tee "$OUT/database-cleanup.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: types-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/types-baseline/
          retention-days: 14
