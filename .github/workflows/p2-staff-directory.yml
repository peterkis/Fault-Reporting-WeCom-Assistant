name: P2 staff directory regression
on:
  pull_request:
    paths:
      - '.github/workflows/p2-staff-directory.yml'
      - '.github/review/**'
      - 'scripts/validate-p2-016-historical.mjs'
      - 'scripts/validate-p2-016-ticket-lifecycle-workbench.mjs'
      - 'tests/p2-016-historical-validation.test.mjs'
      - 'tools/ts-migration/run-tests.mts'
      - 'tools/ts-migration/routing.mts'
      - 'src/p2-007-*.mjs'
      - 'src/p2-007-*.mts'
      - 'src/p2-015-*.mjs'
      - 'src/p2-015-*.mts'
      - 'src/p2-016-*.mjs'
      - 'src/p2-016-*.mts'
      - 'scripts/p2-016-process-role.mjs'
      - 'scripts/p2-016-process-role.mts'
      - 'scripts/p2-012-process-role.mjs'
      - 'scripts/p2-012-process-role.mts'
      - 'scripts/p2-007-migrate.mjs'
      - 'scripts/p2-007-migrate.mts'
      - 'scripts/p2-g1-process-role.mjs'
      - 'scripts/p2-g1-process-role.mts'
      - 'tests/p2-016-workbench-http.integration.test.mjs'
      - 'tests/p2-016-workbench-http.integration.test.mts'
      - 'tests/p2-016-schema-contract.test.mjs'
      - 'tests/p2-016-schema-contract.test.mts'
      - 'tests/p2-007-*.mjs'
      - 'tests/p2-007-*.mts'
      - 'tests/helpers/p2-007-*.mjs'
      - 'tests/helpers/p2-007-*.mts'
      - 'tests/p2-015-*.mjs'
      - 'tests/p2-015-*.mts'
      - 'tests/helpers/p2-015-postgres-harness.mjs'
      - 'tests/helpers/p2-015-postgres-harness.mts'
      - 'tests/helpers/p2-016-postgres-harness.mjs'
      - 'tests/helpers/p2-016-postgres-harness.mts'
      - 'src/platform/**'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - 'database/migrations/036*'
      - 'web/admin-workbench-prototype/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: directory_ci_only
          POSTGRES_DB: directory_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TS_MIGRATION_TEST_DB_ISOLATED: '1'
      PILOT_DATABASE_URL: postgresql://postgres:directory_ci_only@127.0.0.1:5432/directory_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/admin-workbench-prototype/package-lock.json
      - name: Prepare the YAML parser required by frozen OpenAPI tests
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix web/admin-workbench --ignore-scripts --no-audit --no-fund
      - name: Published checkout identity (not readiness)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/directory-review"
          node .github/review/verify-published-history.mjs --expected-head "$EXPECTED_HEAD" 2>&1 | tee "$RUNNER_TEMP/directory-review/history-identity.txt"
      - name: Check optional prototype and historical impact
        id: optional
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const {EXPECTED_BASE:base,EXPECTED_HEAD:head,GITHUB_OUTPUT:output}=process.env;
          if(!/^[a-f0-9]{40}$/.test(base??'')||!/^[a-f0-9]{40}$/.test(head??'')||!output)throw Error('DIRECTORY_DIFF_BASE_REQUIRED');
          const changed=execFileSync('git',['diff','--name-only','-z',base,head],{encoding:'utf8'}).split('\0').filter(Boolean);
          const packageScripts=ref=>JSON.parse(execFileSync('git',['show',ref+':package.json'],{encoding:'utf8'})).scripts;
          let prototypeScript=false,historicalScript=false;
          if(changed.includes('package.json')){
            const before=packageScripts(base),after=packageScripts(head);
            prototypeScript=before['prototype:admin:build']!==after['prototype:admin:build'];
            historicalScript=before['validate:p2:016:historical']!==after['validate:p2:016:historical'];
          }
          const prototype=prototypeScript||changed.some(p=>/^web\/admin-workbench-prototype\//.test(p));
          const historical=historicalScript||changed.some(p=>/^(?:\.github\/review\/[^/]+\.(?:mjs|json)$|scripts\/validate-p2-016-(?:historical|ticket-lifecycle-workbench)\.mjs$|tests\/p2-016-historical-validation\.test\.mjs$|tools\/ts-migration\/(?:run-tests|routing)\.mts$)/.test(p));
          appendFileSync(output,`prototype=${prototype}\nhistorical=${historical}\n`);
          NODE
      - name: Current directory and orchestration regression
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/directory-review"
          npm run migration:tools
          node .build/tools/run-tests.mjs --selection t02-baseline --report-dir "$RUNNER_TEMP/directory-review/current" 2>&1 | tee "$RUNNER_TEMP/directory-review/current.txt"
      - name: Architecture regression
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/directory-review"
          npm run validate:architecture:v1.4 2>&1 | tee "$RUNNER_TEMP/directory-review/architecture.txt"
      - name: Prototype typecheck and build (not production acceptance)
        if: ${{ !cancelled() && steps.optional.outputs.prototype == 'true' }}
        run: |
          set -euo pipefail
          npm ci --prefix web/admin-workbench-prototype --ignore-scripts --no-audit --no-fund
          npm run prototype:admin:build 2>&1 | tee "$RUNNER_TEMP/directory-review/prototype-build.txt"
      - name: Frozen historical validation (not current readiness)
        if: ${{ !cancelled() && steps.optional.outputs.historical == 'true' }}
        run: |
          set -euo pipefail
          npm run validate:p2:016:historical 2>&1 | tee "$RUNNER_TEMP/directory-review/historical.txt"
      - name: Exact tracked source for this review
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/directory-review"
          git rev-parse HEAD > "$RUNNER_TEMP/directory-review/source-sha.txt"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/directory-review/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: directory-review-${{ github.run_id }}
          path: ${{ runner.temp }}/directory-review/
          retention-days: 14
