name: One-time P2 historical membership repair

on:
  push:
    branches:
      - 'codex/admin-workbench-prototype'
    paths:
      - '.github/workflows/p2-historical-membership-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Restore authoritative source and apply exact repair
        env:
          AUTHORITATIVE_PARENT: c2d953d28bd57214491d94d6ee481327f2e740d9
        run: |
          set -euo pipefail
          git show "$AUTHORITATIVE_PARENT:src/p2-016-ticket-query.mjs" > src/p2-016-ticket-query.mjs
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/p2-016-ticket-query.mjs')
          text = path.read_text(encoding='utf-8')
          anchor = "const BROAD=p=>p.roles.some(r=>['ADMIN','DISPATCHER'].includes(r));"
          addition = """const HISTORICAL_MEMBERSHIP_ROLES=Object.freeze({
            WECOM_DIRECTORY:Object.freeze(['PRIMARY','SECONDARY','ROTATION']),
            THIRD_PARTY_STAFF_DIRECTORY:Object.freeze(['MEMBER']),
          });
          const historicalMembershipRole=(source,role)=>HISTORICAL_MEMBERSHIP_ROLES[source]?.includes(role)?role:'UNKNOWN';"""
          old = "role:['PRIMARY','SECONDARY','ROTATION'].includes(m?.role)?m.role:'UNKNOWN'"
          new = "role:historicalMembershipRole(snapshot.source,m?.role)"
          if text.count(anchor) != 1 or text.count(old) != 1:
              raise SystemExit('authoritative source markers changed')
          text = text.replace(anchor, f'{anchor}\n{addition}', 1).replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check src/p2-016-ticket-query.mjs
          grep -F "role:historicalMembershipRole(snapshot.source,m?.role)" src/p2-016-ticket-query.mjs
          git diff --check
      - name: Commit exact repair and remove one-time workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/p2-historical-membership-repair.yml
          git add src/p2-016-ticket-query.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(directory): preserve MEMBER in historical projections'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
